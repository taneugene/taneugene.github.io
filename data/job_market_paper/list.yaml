works:
- title: "Connection Charges and the Private Provision of Utility Infrastructure"
  pdflink: "/pdf/tan_private_provision_of_utility_infrastructure.pdf"
  abstract: >
      Utilities often impose an upfront connection charge that increases with distance to existing infrastructure.  Users who connect and induce the utility to marginally extend the network reduce their neighbors' connection charges by bringing them closer. This provision externality creates a game in which prospective users trade off the benefits of connecting now against the externality they could receive by strategically delaying until a neighbor connects first.  I test whether the game exists in rural Rwandan electricity distribution, using timestamped geospatial data from 177 distribution networks to reconstruct the rollout of the grid and measure distances, charges, and provision externalities over time.  Using panel two-stage least squares, I find that anticipating the average reduction in distance to the grid over the next eight weeks substantially lowers weekly adoption hazards from about 1.5\% to 0.38\%. Using placebo grid extensions that confer scale economies but no provision externality, I find insignificant effects of opposite sign, which rules out supply-side bunching explanations for observed delays. Therefore, the game exists and strategic delays slow electrification. However, the game's equilibrium predicts progressive cost incidence. First movers reveal high values by connecting, and their provision externality cross-subsidizes their lower-value neighbors. In the cross section, I find connection charges paid rise with willingness to pay with an elasticity of 0.2, where a single price would predict zero.  Distance-based charges therefore are a mechanism for utilities to intertemporally price discriminate.
